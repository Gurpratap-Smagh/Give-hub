name: Slither Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd contracts
          yarn install

      - name: Run Slither
        uses: crytic/slither-action@v0.3.0
        with:
          target: 'contracts/'
          # We tell slither that the dependencies are in contracts/node_modules 
          # but the base for compilation is the contracts/ folder
          slither-args: >-
            --solc-args "--base-path contracts --include-path contracts/node_modules"
            --filter-paths "node_modules"
          fail-on: 'high'